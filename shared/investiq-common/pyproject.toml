[project]
name = "investiq-common"
version = "0.1.0"
description = "InvestIQ Platform共享库 - 数据模型、客户端和工具函数"
authors = [{name = "InvestIQ Team"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "structlog>=23.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investiq_common"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]