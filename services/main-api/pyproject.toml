[project]
name = "investiq-main-api"
version = "0.1.0"
description = "InvestIQ平台主API服务 - API网关和核心业务逻辑"
authors = [{name = "InvestIQ Team"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Web框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.2.0",
    
    # 数据库
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.7",
    
    # 缓存
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    
    # HTTP客户端
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    
    # 数据验证
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    
    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    
    # 认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # 工具
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.18.0",
    
    # 共享库
    "investiq-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",  # 用于测试
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"