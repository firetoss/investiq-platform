version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: investiq-postgres
    environment:
      POSTGRES_DB: investiq
      POSTGRES_USER: investiq
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investiq -d investiq"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: investiq-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: investiq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 核心业务服务
  scoring-service:
    build:
      context: .
      dockerfile: services/scoring-service/Dockerfile
    container_name: investiq-scoring-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8001
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  gatekeeper-service:
    build:
      context: .
      dockerfile: services/gatekeeper-service/Dockerfile
    container_name: investiq-gatekeeper-service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8002
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: investiq-portfolio-service
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8003
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  liquidity-service:
    build:
      context: .
      dockerfile: services/liquidity-service/Dockerfile
    container_name: investiq-liquidity-service
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8004
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: investiq-alert-service
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8005
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  evidence-service:
    build:
      context: .
      dockerfile: services/evidence-service/Dockerfile
    container_name: investiq-evidence-service
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - SERVICE_PORT=8006
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    container_name: investiq-audit-service
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=investiq
      - DATABASE_USER=investiq
      - DATABASE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8007
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # AI模型服务（基础版本）
  llm-service:
    build:
      context: .
      dockerfile: services/llm-service/Dockerfile
    container_name: investiq-llm-service
    ports:
      - "8011:8011"
    environment:
      - MODEL_PATH=/models
      - DEVICE=cpu  # 暂时使用CPU，后续优化为CUDA
      - SERVICE_PORT=8011
    volumes:
      - ./models:/models:ro
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # GPU配置（在Jetson上启用）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  sentiment-service:
    build:
      context: .
      dockerfile: services/sentiment-service/Dockerfile
    container_name: investiq-sentiment-service
    ports:
      - "8012:8012"
    environment:
      - MODEL_PATH=/models
      - DEVICE=cpu
      - SERVICE_PORT=8012
    volumes:
      - ./models:/models:ro
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  timeseries-service:
    build:
      context: .
      dockerfile: services/timeseries-service/Dockerfile
    container_name: investiq-timeseries-service
    ports:
      - "8013:8013"
    environment:
      - MODEL_PATH=/models
      - DEVICE=cpu
      - SERVICE_PORT=8013
    volumes:
      - ./models:/models:ro
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # API网关
  gateway:
    image: caddy:2-alpine
    container_name: investiq-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scoring-service
      - gatekeeper-service
      - portfolio-service
      - liquidity-service
      - alert-service
      - evidence-service
      - audit-service
      - llm-service
      - sentiment-service
      - timeseries-service
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investiq-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  investiq_network:
    driver: bridge
    name: investiq_network